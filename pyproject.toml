[project]
name = "geap-hitl-pattern"
version = "1.0.0"
description = "Autonomous Trend-to-Asset Pipeline: Brand Building HITL Approval Example Application 3-Tier Agentic HITL Architecture with Google Cloud Workflows, Vertex AI ADK & Memory Bank, and AlloyDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29.0",
    "sqlalchemy>=2.0.35",
    "google-genai>=1.0.0",
    "google-auth>=2.35.0",
    "google-cloud-workflows>=1.15.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-firestore>=2.19.0",
    "pillow>=10.4.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "playwright>=1.48.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
